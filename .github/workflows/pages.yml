name: Publicar Master Viviana x BellaShop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar sitio publico
        run: |
          mkdir -p _site
          cp index.html admin.html privacidad.html styles.css app.js admin.js api.js config.js _site/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Cargar archivos de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
